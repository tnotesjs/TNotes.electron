# 构建 TNotes SSG 站点并部署到 GitHub Pages
name: Deploy TNotes site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *" # 每月 1 号 UTC 00:00 自动触发 deploy

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - uses: pnpm/action-setup@v3
        with:
          version: 11.10.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Install dependencies
        run: pnpm install
      - name: Update stats
        run: pnpm tn:update
      - name: Build with TNotes SSG
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm tn:build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .tnotes/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # 部署完成后通知根仓重新收集（根站数据管道已迁新格式，2026-09-09 恢复）。
  # payload 带 sha：根仓 collect 按 commit 精确拉取本库数据，绕过 raw CDN 缓存。
  notify:
    needs: deploy
    runs-on: ubuntu-latest
    name: Notify TNotes
    steps:
      - name: Trigger root repo collect
        run: |
          curl -sf --max-time 15 -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Authorization: Bearer ${{ secrets.TNOTES_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/tnotesjs/TNotes/dispatches \
            -d '{"event_type":"sub_repo_updated","client_payload":{"repo":"${{ github.event.repository.name }}","sha":"${{ github.sha }}"}}'
